services:
  migrations:
    build: .
    command: alembic upgrade head
    env_file: 
      - .env.dev
    depends_on:
      db:
        condition: service_healthy
  web:
    build:
      context: .
      dockerfile: ./Dockerfile
    command: uvicorn src.main:app --host 0.0.0.0
    env_file:
      - .env.dev
    ports:
      - 8000:8000
    depends_on:
      - db

  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env.dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
