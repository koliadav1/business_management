[project]
name = "business-management-system"
version = "0.1.0"
description = "Система управления бизнесом"
requires-python = ">=3.13"
dependencies = [
    "alembic==1.18.4",
    "asyncpg==0.31.0",
    "fastapi==0.135.2",
    "pydantic-settings==2.13.1",
    "SQLAlchemy==2.0.48",
    "uvicorn==0.42.0",
    "fastapi-users==15.0.5",
    "passlib==1.7.4",
    "python-jose==3.5.0",
    "sqladmin==0.24.0",
]

[project.optional-dependencies]
dev = [
    "black==26.3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 79
force-exclude = "migrations"