[project]
name = "business-management-system"
version = "1.2.0"
description = "Система управления бизнесом"
requires-python = ">=3.13"
dependencies = [
    "alembic==1.18.4",
    "asyncpg==0.31.0",
    "fastapi==0.135.2",
    "pydantic-settings==2.13.1",
    "SQLAlchemy==2.0.48",
    "uvicorn==0.42.0",
    "fastapi-users==15.0.5",
    "fastapi-users-db-sqlalchemy==7.0.0",
    "passlib==1.7.4",
    "python-jose==3.5.0",
    "sqladmin==0.24.0",
    "itsdangerous==2.2.0",
]

[project.optional-dependencies]
dev = [
    "black==26.3.1",
    "pytest>=9.0.0",
    "pytest-cov==7.1.0",
    "pytest-asyncio==1.3.0",
    "httpx==0.28.1",
    "pytest-mock==3.15.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 79
force-exclude = "migrations"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest]
minversion = "9.0"
testpaths = [
    "/tests",
]
pythonpath = [
    "."
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"

[tool.coverage.run]
omit = [
    "tests/*", 
    "venv/*", 
    "migrations/*", 
    "src/static/*", 
    "src/core/config.py",
    "src/core/database.py",
    "src/core/interfaces/*",
    "src/utils/dependencies.py", 
    "src/main.py",
    "src/schemas/*",
    "src/models/*",
    "src/admin/*",
    "src/services/user_manager.py",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "class .*\\(Exception\\):",
    "pass",
]