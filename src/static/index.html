<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Система управления бизнесом</title>
    <script defer src="/js/app.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>

<body>
    <div x-data="app()" x-init="initApp">
        <div>
            <!-- Вход/Регистрация -->
            <div x-show="!token">
                <div>
                    <h3>Вход</h3>
                    <div>
                        <label>Email</label>
                        <input type="email" x-model="loginEmail">
                    </div>
                    <div>
                        <label>Пароль</label>
                        <input type="password" x-model="loginPassword">
                    </div>
                    <button @click="login">Войти</button>
                    <hr>
                    <h3>Регистрация</h3>
                    <div>
                        <label>Email</label>
                        <input type="email" x-model="regEmail">
                    </div>
                    <div>
                        <label>Пароль</label>
                        <input type="password" x-model="regPassword">
                    </div>
                    <button @click="register">Зарегистрироваться</button>
                </div>
            </div>

            <!-- При входе -->
            <div x-show="token">
                <div>
                    <template x-for="tab in ['profile', 'teams', 'tasks', 'meetings', 'ratings', 'calendar']">
                        <button @click="activeTab = tab" x-text="tabLabel(tab)"></button>
                    </template>
                    <button @click="logout">Выйти</button>
                </div>

                <div>
                    <!-- Профиль -->
                    <div x-show="activeTab === 'profile'">
                        <div>
                            <h3>Мой профиль</h3>
                            <div>
                                <label>Имя</label>
                                <input x-model="profileForm.name">
                            </div>
                            <div>
                                <label>Фамилия</label>
                                <input x-model="profileForm.surname">
                            </div>
                            <div>
                                <label>Телефон</label>
                                <input x-model="profileForm.phone_number">
                            </div>
                            <div>
                                <label>Email</label>
                                <input type="email" x-model="profileForm.email">
                            </div>
                            <div>
                                <label>Текущий пароль (для изменения email/пароля)</label>
                                <input type="password" x-model="profileForm.current_password">
                            </div>
                            <div>
                                <label>Новый пароль</label>
                                <input type="password" x-model="profileForm.password">
                            </div>
                            <button @click="updateProfile">Обновить профиль</button>
                            <button @click="deleteAccount">Удалить
                                аккаунт</button>
                        </div>
                    </div>

                    <!-- Команды -->
                    <div x-show="activeTab === 'teams'">

                        <!-- Без команды -->
                        <div x-show="!currentUser?.team_id">
                            <div>
                                <h3>Создать команду</h3>
                                <input type="text" placeholder="Название" x-model="newTeamName">
                                <textarea placeholder="Описание" x-model="newTeamDesc"></textarea>
                                <button @click="createTeam">Создать</button>
                            </div>
                            <div>
                                <h3>Присоединиться по коду</h3>
                                <input type="text" placeholder="Код приглашения" x-model="inviteCode">
                                <button @click="joinTeamByCode">Присоединиться</button>
                            </div>
                            <div>
                                <h3>Все команды (<span x-text="allTeams.length"></span>)</h3>
                                <template x-for="team in allTeams">
                                    <div>
                                        <strong x-text="team.name"></strong>
                                        <span x-text="team.description"></span>
                                    </div>
                                </template>
                                <div x-show="allTeams.length === 0">Нет доступных команд</div>
                                <button @click="loadAllTeams">Обновить список</button>
                            </div>
                        </div>

                        <!-- В команде -->
                        <div x-show="currentUser?.team_id && myTeam">
                            <div>
                                <div>
                                    <h3 x-text="myTeam.name"></h3>
                                    <span x-show="isTeamAdmin">Admin команды</span>
                                </div>
                                <p x-text="myTeam.description || 'Нет описания'"></p>
                                <div x-show="isTeamAdmin">
                                    <button @click="getInviteCode">Получить invite-код</button><br>
                                    <div x-show="inviteCodeValue">
                                        <strong>Код приглашения:</strong> <span x-text="inviteCodeValue"></span><br>
                                    </div>
                                    <button @click="deleteTeam">Удалить команду</button>
                                </div>
                            </div>
                            <div>
                                <h4>Участники (<span x-text="teamMembers.length"></span>)</h4>

                                <template x-for="member in teamMembers">
                                    <div>
                                        <span>
                                            <b x-text="member.name || member.email || member.id"></b>
                                            (роль: <span x-text="member.role"></span>)
                                        </span>
                                        <span x-show="isTeamAdmin && member.id !== currentUser?.id">
                                            <button
                                                @click="changeMemberRole(member.id, member.role === 'manager' ? 'employee' : 'manager')">
                                                Сменить роль
                                            </button>
                                            <button @click="removeMember(member.id)">Исключить</button>
                                        </span>
                                    </div>
                                </template>

                                <div x-show="teamMembers.length === 0">Загрузка участников...</div>
                                <button @click="loadMyTeam">Обновить список участников</button>
                                <button x-show="!isTeamAdmin" @click="quitTeam">Выйти из
                                    команды</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
